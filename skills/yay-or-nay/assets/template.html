<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decisions</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.1.0/dist/basecoat-nova.cdn.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist@5.3.0/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist@5.3.0/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist@5.3.0/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist@5.3.0/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.3.0/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.3.0/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.3.0/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.3.0/700.css">
<script>
  const dark = matchMedia('(prefers-color-scheme: dark)');
  const setTheme = () => document.documentElement.classList.toggle('dark', dark.matches);
  setTheme(); dark.addEventListener('change', setTheme);
</script>
<style>
/* Primary stays black (white in dark mode). Accents: copper and forest. */
:root { --copper: #a65f2d; --copper-soft: oklch(0.96 0.02 65); --forest: #2a3b2a; --forest-soft: oklch(0.96 0.02 145); --blue: #2563eb; }
html.dark { --copper: #c47a3f; --copper-soft: oklch(0.25 0.05 55 / 0.3); --forest: #98b3a1; --forest-soft: oklch(0.25 0.04 145 / 0.3); --blue: #60a5fa; }
/* Option colors from the spec: green, red, blue, gray, amber. */
:root { --green: var(--forest); --red: var(--destructive); --amber: var(--copper); --gray: var(--muted-foreground); }
body { font-size: 16px; line-height: 1.6; background: var(--background); color: var(--foreground); }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.icon { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn { min-height: 44px; }
main { max-width: 45rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
header { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
header h1 { font-size: 1.125rem; font-weight: 600; letter-spacing: -.01em; margin: 0; flex: 1; min-width: 12em; }
.stand { color: var(--muted-foreground); font-size: .875rem; font-variant-numeric: tabular-nums; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; margin: 1rem 0 1.25rem; }
.dot { width: 14px; height: 14px; border-radius: 4px; border: 0; padding: 0; cursor: pointer; background: var(--border); }
.dot:hover { background: var(--muted-foreground); }
.dot.active { box-shadow: 0 0 0 2px var(--background), 0 0 0 3px var(--foreground); }
#card { font-size: 1rem; }
#card > header { display: block; }
#card .head { display: flex; gap: .375rem; flex-wrap: wrap; align-items: center; }
#card h2 { font-size: 1.375rem; font-weight: 600; letter-spacing: -.02em; line-height: 1.3; margin: .75rem 0 0; }
#card section > * + * { margin-top: .75rem; }
.text, .extra { white-space: pre-line; margin: 0; }
#card h3 { font-size: .875rem; font-weight: 500; color: var(--muted-foreground); margin-top: 1.5rem; }
blockquote { margin: 0; padding: .625rem .875rem; background: var(--muted); border-left: 2px solid var(--copper);
  border-radius: 0 var(--radius) var(--radius) 0; }
blockquote small { display: block; color: var(--muted-foreground); font-size: .8125rem; margin-top: .25rem; }
.alert.warn { border-left: 3px solid var(--copper); }
.muted { color: var(--muted-foreground); font-style: italic; }
.verdict { display: flex; flex-wrap: wrap; gap: .5rem; position: sticky; bottom: 0; background: var(--card);
  border-top: 1px solid var(--border); padding-top: 1rem; }
.verdict .btn { flex: 1 1 auto; white-space: nowrap; color: var(--c); border-color: color-mix(in srgb, var(--c) 45%, var(--border)); }
.verdict .btn:hover { background: color-mix(in srgb, var(--c) 10%, var(--card)); }
.verdict .btn.chosen { background: var(--c); border-color: var(--c); color: var(--background); }
.verdict .kbd { color: inherit; background: none; border: 1px solid currentColor; opacity: .6; }
.nav { display: flex; justify-content: space-between; gap: .5rem; margin-top: 1rem; }
.hint { color: var(--muted-foreground); font-size: .8125rem; line-height: 2; text-align: center; margin-top: 1.25rem; }
@media (max-width: 520px) {
  header h1, .stand { flex-basis: 100%; }
  .verdict .kbd { display: none; }
  .verdict .btn { flex: 1 1 calc(50% - 4px); min-width: 0; white-space: normal; }
}
</style>
</head>
<body>
<!-- Icons: Lucide, lucide-static@1.70.0, ISC license. To add one, copy the inner elements of
     https://cdn.jsdelivr.net/npm/lucide-static@1.70.0/icons/<name>.svg into a new <symbol id="i-<name>">. -->
<svg class="sprite" aria-hidden="true">
  <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 15V3" /><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></symbol>
  <symbol id="i-circle-dashed" viewBox="0 0 24 24"><path d="M10.1 2.182a10 10 0 0 1 3.8 0" /><path d="M13.9 21.818a10 10 0 0 1-3.8 0" /><path d="M17.609 3.721a10 10 0 0 1 2.69 2.7" /><path d="M2.182 13.9a10 10 0 0 1 0-3.8" /><path d="M20.279 17.609a10 10 0 0 1-2.7 2.69" /><path d="M21.818 10.1a10 10 0 0 1 0 3.8" /><path d="M3.721 6.391a10 10 0 0 1 2.7-2.69" /><path d="M6.391 20.279a10 10 0 0 1-2.69-2.7" /></symbol>
  <symbol id="i-triangle-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></symbol>
</svg>
<main>
  <header>
    <h1 id="title"></h1>
    <span class="stand" id="stand"></span>
    <button class="btn" data-variant="outline" id="copy"><svg class="icon"><use href="#i-copy"/></svg><span data-l="copy"></span></button>
    <button class="btn" data-variant="outline" id="export"><svg class="icon"><use href="#i-download"/></svg><span data-l="export"></span></button>
  </header>
  <div class="dots" id="dots"></div>
  <article class="card" id="card"></article>
  <div class="nav">
    <button class="btn" data-variant="ghost" id="prev"><svg class="icon"><use href="#i-arrow-left"/></svg><span data-l="prev"></span></button>
    <button class="btn" data-variant="ghost" id="open"><svg class="icon"><use href="#i-circle-dashed"/></svg><span data-l="open"></span></button>
    <button class="btn" data-variant="ghost" id="next"><span data-l="next"></span><svg class="icon"><use href="#i-arrow-right"/></svg></button>
  </div>
  <p class="hint" id="hint"></p>
</main>
<script>
const SPEC = /*SPEC*/{};
const CARDS = SPEC.cards;
const OPTIONS = SPEC.options;
const L = SPEC.labels;
const COLOR = Object.fromEntries(OPTIONS.map(o => [o.value, `var(--${o.color})`]));
const icon = name => `<svg class="icon"><use href="#i-${name}"/></svg>`;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Quotes keep strike-through and italics: both can be the point of the quote.
const md = s => esc(s).replace(/~~(.+?)~~/g, "<s>$1</s>").replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");

document.title = SPEC.title;
document.querySelectorAll("[data-l]").forEach(el => { el.textContent = L[el.dataset.l]; });
$("title").textContent = SPEC.title;
$("hint").innerHTML = esc(L.keys) + ": " + OPTIONS.map(o => `<kbd class="kbd">${esc(o.key.toUpperCase())}</kbd> ${esc(o.label)}`).join(" · ") +
  ` · <kbd class="kbd">←</kbd>/<kbd class="kbd">→</kbd> ${esc(L.browse)}. ${esc(L.saved)}`;

let verdicts = {};
try { verdicts = JSON.parse(localStorage.getItem(SPEC.storage_key)) || {}; } catch (e) { verdicts = {}; }
let pos = Math.max(0, CARDS.findIndex(c => !verdicts[c.id]));

function save() {
  try { localStorage.setItem(SPEC.storage_key, JSON.stringify(verdicts)); } catch (e) { /* export still works */ }
}

function show() {
  const c = CARDS[pos];
  const n = Object.keys(verdicts).length;
  $("stand").textContent = `${c.id} ${L.of} ${CARDS.length} · ${n} ${L.decided}`;
  $("dots").innerHTML = CARDS.map((d, i) =>
    `<button class="dot ${i === pos ? "active" : ""}" style="${verdicts[d.id] ? `background:${COLOR[verdicts[d.id]]}` : ""}" title="${esc(d.id)} ${esc(d.title)}" aria-label="${esc(d.id)} ${esc(d.title)}" data-i="${i}"></button>`).join("");
  const chips = `<span class="badge" data-variant="outline">${esc(c.id)}</span>` +
    [c.category, ...(c.chips || [])].filter(Boolean).map(t => `<span class="badge" data-variant="secondary">${esc(t)}</span>`).join("");
  const evidence = (c.evidence || []).map(b =>
    `<blockquote>${md(b.quote)}${b.source ? `<small>${esc(b.source)}</small>` : ""}</blockquote>`).join("");
  $("card").innerHTML = `
    <header><div class="head">${chips}</div><h2>${esc(c.title)}</h2></header>
    <section>
      ${c.text ? `<p class="text">${esc(c.text)}</p>` : ""}
      ${evidence ? `<h3>${esc(SPEC.evidence_title)}</h3>${evidence}` : ""}
      ${c.warning ? `<div class="alert warn">${icon("triangle-alert")}<section>${esc(c.warning)}</section></div>` : ""}
      ${(c.extras || []).map(x => `<h3>${esc(x.title)}</h3><p class="extra ${x.muted ? "muted" : ""}">${esc(x.text)}</p>`).join("")}
    </section>
    <footer class="verdict">
      ${OPTIONS.map(o => `<button class="btn ${verdicts[c.id] === o.value ? "chosen" : ""}" data-variant="outline" style="--c:${COLOR[o.value]}" data-v="${esc(o.value)}"><span>${esc(o.label)}</span><kbd class="kbd">${esc(o.key.toUpperCase())}</kbd></button>`).join("")}
    </footer>`;
  $("prev").disabled = pos === 0;
  $("next").disabled = pos === CARDS.length - 1;
  $("open").disabled = n === CARDS.length;
}

function decide(v) {
  verdicts[CARDS[pos].id] = v;
  save();
  if (pos < CARDS.length - 1) pos++;
  show();
}

function step(d) { pos = Math.min(CARDS.length - 1, Math.max(0, pos + d)); show(); }

function result() {
  return JSON.stringify({
    title: SPEC.title, exported: new Date().toISOString(),
    decided: Object.keys(verdicts).length, total: CARDS.length,
    verdicts: CARDS.map(c => ({ id: c.id, title: c.title, verdict: verdicts[c.id] || null })),
  }, null, 2);
}

async function copy() {
  const text = result();
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    // file:// or an older browser: fall back to a hidden textarea.
    const t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove();
  }
  const use = $("copy").querySelector("use");
  use.setAttribute("href", "#i-check");
  setTimeout(() => use.setAttribute("href", "#i-copy"), 1500);
}

$("card").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) decide(b.dataset.v); });
$("dots").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b) { pos = +b.dataset.i; show(); } });
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
$("open").onclick = () => { const i = CARDS.findIndex(c => !verdicts[c.id]); if (i >= 0) { pos = i; show(); } };
$("copy").onclick = copy;
$("export").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([result()], { type: "application/json" }));
  a.download = SPEC.export_file;
  a.click();
};
document.addEventListener("keydown", e => {
  // Held keys auto-repeat; without this guard one long press decides a whole stack of cards.
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === "TEXTAREA") return;
  const o = OPTIONS.find(o => o.key.toLowerCase() === e.key.toLowerCase());
  if (o) decide(o.value);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
});
show();
</script>
</body>
</html>
